version: 2

# Minor and patch updates arrive as one pull request per ecosystem. The
# cooldown waits a week after a release before proposing it, so a
# compromised release has time to be caught and pulled first. Security
# updates are not delayed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # uv.lock, including the development tools
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
