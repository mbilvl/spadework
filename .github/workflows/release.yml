name: Release

# Pushing a tag such as v0.1.0 builds the package, publishes it to PyPI
# through trusted publishing (OIDC, no stored tokens) with attestations, and
# creates the GitHub release. The tag must match `__version__` in
# src/spadework/__init__.py.
on:
  push:
    tags: ["v*"]

# Every job sets its own permissions.
permissions: {}

# Releases run one at a time per tag and are never cancelled half way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the repository
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a release is built from a clean slate.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Check the tag matches the package version
        id: version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/spadework/__init__.py)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read __version__ from src/spadework/__init__.py."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version in src/spadework/__init__.py."
            echo "::error::Set __version__ to the release version, then delete the tag and tag that commit, or tag v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build --no-sources

      # Install each built distribution on its own and run it, so a file
      # missing from the wheel or the sdist fails here rather than on PyPI.
      - name: Smoke test the built packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo "::error::Expected one wheel and one sdist in dist/, found: $(ls dist)"
            exit 1
          fi
          for dist in "${wheels[0]}" "${sdists[0]}"; do
            got="$(uvx --isolated --from "$dist" spadework --version)"
            if [[ "$got" != "spadework $VERSION" ]]; then
              echo "::error::$dist printed '$got', expected 'spadework $VERSION'."
              exit 1
            fi
            echo "$dist: $got"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protection rules for this environment (required reviewers, tags only)
    # are set in the repository settings, and PyPI trusts only this
    # workflow in this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/spadework/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # to authenticate to PyPI and sign attestations
      attestations: write # to store the build provenance on GitHub
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # SLSA build provenance, verifiable with
      # `gh attestation verify <file> --repo mbilvl/spadework`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      # Also signs and uploads PEP 740 attestations to PyPI.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # The notes are the tag's `## [x.y.z]` section of CHANGELOG.md, or
      # GitHub's generated notes when there is no such section.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## [$version]" '
            /^## / { if (found) exit; found = index($0, heading) == 1; next }
            found && !/^\[[^ ]+\]: / { print }
          ' CHANGELOG.md > "$notes"

          args=(--verify-tag --title "spadework $version")
          if grep -q '[^[:space:]]' "$notes"; then
            args+=(--notes-file "$notes")
          else
            echo "::warning::CHANGELOG.md has no '## [$version]' section, so the release notes are generated."
            args+=(--generate-notes)
          fi
          prerelease='(a|b|rc|\.dev)[0-9]+$'
          if [[ "$version" =~ $prerelease ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*
